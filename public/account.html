<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Account - Sukhi Fireworks</title>
  <link rel="stylesheet" href="js/site-shell.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    main { width:min(960px,calc(100% - 32px)); margin:0 auto; padding:36px 0 60px; }
    h1 { font:800 36px/1.1 'Space Grotesk',sans-serif; color:#111d3a; margin:0 0 8px; }
    .intro { color:#667085; font-size:14px; margin:0 0 28px; }
    .profile-card {
      background:#fff; border:1px solid #e5e9f2; border-radius:20px; padding:24px;
      box-shadow:0 10px 30px rgba(17,29,58,.06); margin-bottom:32px;
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
    }
    .profile-info { display:flex; align-items:center; gap:16px; }
    .profile-avatar {
      width:52px; height:52px; border-radius:50%; background:#fff0ed; color:#f05a47;
      display:grid; place-items:center; font-size:24px; font-weight:800; font-family:'Space Grotesk',sans-serif;
    }
    .profile-meta h2 { margin:0 0 4px; font:700 18px 'Space Grotesk',sans-serif; color:#111d3a; }
    .profile-meta p { margin:0; font-size:13px; color:#667085; }
    .profile-actions { display:flex; gap:10px; align-items:center; }
    .btn-action {
      padding:9px 16px; border-radius:12px; font-size:12px; font-weight:700;
      text-decoration:none; display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:0;
      transition:all .2s ease;
    }
    .btn-primary { background:#f05a47; color:#fff; }
    .btn-primary:hover { background:#cf3f36; transform:translateY(-1px); }
    .btn-secondary { background:#f4f6fa; color:#111d3a; border:1px solid #e5e9f2; }
    .btn-secondary:hover { background:#e9edf5; }
    .section-title { font:700 20px 'Space Grotesk',sans-serif; color:#111d3a; margin:0 0 16px; display:flex; align-items:center; gap:8px; }
    .orders { display:grid; gap:16px; }
    .order {
      padding:22px; background:#fff; border:1px solid #e5e9f2; border-radius:18px;
      box-shadow:0 10px 28px rgba(17,29,58,.06); transition:box-shadow .2s;
    }
    .order:hover { box-shadow:0 14px 34px rgba(17,29,58,.1); }
    .order-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; flex-wrap:wrap; }
    .order-id { color:#f05a47; font-weight:800; font-family:'Space Grotesk',sans-serif; font-size:16px; }
    .order-date { color:#8d98af; font-size:12px; margin-top:2px; display:block; }
    .status { display:inline-block; padding:5px 12px; border-radius:999px; background:#fff0ed; color:#cf3f36; font-size:12px; font-weight:800; }
    .status-completed { background:#edfdf5; color:#15803d; }
    .status-shipped   { background:#eff6ff; color:#1d4ed8; }
    .status-cancelled { background:#fef2f2; color:#b91c1c; }
    .status-pending   { background:#fff7ed; color:#c2410c; }
    .order-items { color:#475467; font-size:13px; margin:14px 0; line-height:1.6; padding:12px 14px; background:#fafbff; border-radius:12px; border:1px solid #eef2fa; }
    .order-foot { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding-top:12px; border-top:1px solid #f1f4fa; }
    .order-total { font:800 18px 'Space Grotesk',sans-serif; color:#111d3a; }
    .empty { padding:42px 24px; text-align:center; background:#fff; border:1px dashed #cbd3e1; border-radius:20px; color:#667085; }
    .empty h3 { margin:0 0 6px; color:#111d3a; font-family:'Space Grotesk',sans-serif; }
    .empty a { display:inline-block; margin-top:14px; }
    @media(max-width:600px) {
      main { padding:24px 0 86px; }
      h1 { font-size:28px; }
      .profile-card { flex-direction:column; align-items:flex-start; }
      .profile-actions { width:100%; justify-content:flex-start; }
      .order-head { flex-direction:column; }
      .order-foot { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body class="site-page">
  <main>
    <h1>My Account</h1>
    <p class="intro">Manage your celebration orders, invoices, and profile details.</p>

    <!-- Customer Profile Overview -->
    <section class="profile-card">
      <div class="profile-info">
        <div class="profile-avatar" id="userAvatar">S</div>
        <div class="profile-meta">
          <h2 id="userName">Valued Customer</h2>
          <p id="userEmail">Loading your account details…</p>
        </div>
      </div>
      <div class="profile-actions">
        <a href="shop.html" class="btn-action btn-primary">
          <span class="material-symbols-outlined" style="font-size:16px;">storefront</span> Explore Shop
        </a>
        <button onclick="Auth.logout()" type="button" class="btn-action btn-secondary">
          <span class="material-symbols-outlined" style="font-size:16px;">logout</span> Logout
        </button>
      </div>
    </section>

    <!-- Order Requests & Invoices -->
    <h2 class="section-title">
      <span class="material-symbols-outlined" style="color:#f05a47;">receipt_long</span>
      Your Festive Order Requests
    </h2>
    <div id="orders" class="orders">
      <div class="empty">Loading your orders...</div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <!-- EmailJS SDK for background email support -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/invoice-generator.js"></script>
  <script src="js/site-shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('orders');
      const nameEl = document.getElementById('userName');
      const emailEl = document.getElementById('userEmail');
      const avatarEl = document.getElementById('userAvatar');

      function updateProfile(user) {
        if (!user) return;
        const displayName = user.displayName || (user.email ? user.email.split('@')[0] : 'Customer');
        if (nameEl) nameEl.textContent = displayName;
        if (emailEl) emailEl.textContent = user.email || 'Direct Access Account';
        if (avatarEl) avatarEl.textContent = (displayName[0] || 'S').toUpperCase();
      }

      function getLocalOrdersForUser(user) {
        const stored = Storage.get('sukhi_orders', []);
        if (!Array.isArray(stored)) return [];
        if (!user || !user.email) return stored;
        const normalized = user.email.toLowerCase();
        return stored.filter(o => {
          const orderEmail = (o.customerEmail || o.delivery?.email || '').toLowerCase();
          const orderUid = o.userId;
          return !orderEmail || orderEmail === normalized || (user.uid && orderUid === user.uid);
        });
      }

      const render = (orders) => {
        if (!orders || !orders.length) {
          container.innerHTML = `
            <div class="empty">
              <h3>No order requests submitted yet</h3>
              <p>Pick your favourite sparkles and ground wheels from our festive collection.</p>
              <a href="shop.html" class="btn-action btn-primary">Start Shopping</a>
            </div>`;
          return;
        }

        container.innerHTML = orders.map(order => {
          const dateStr = order.createdAt?.toDate ? order.createdAt.toDate().toLocaleString('en-IN') :
                          order.createdAt ? new Date(order.createdAt).toLocaleString('en-IN') : 'Recent request';
          const statusClass = (order.status === 'Completed' || order.status === 'Delivered') ? 'status-completed' :
                              (order.status === 'Shipped') ? 'status-shipped' :
                              (order.status === 'Cancelled') ? 'status-cancelled' : '';
          const itemsSummary = (order.items || []).map(item => `${item.name} × ${item.qty || 1}`).join(', ') || 'No item details';
          const safeOrderJson = encodeURIComponent(JSON.stringify(order));

          return `
            <article class="order">
              <div class="order-head">
                <div>
                  <div class="order-id">#${order.id || 'SK-REQ'}</div>
                  <span class="order-date">${dateStr}</span>
                </div>
                <div>
                  <span class="status ${statusClass}">${order.status || 'Pending'}</span>
                </div>
              </div>
              <div class="order-items">
                <strong>Items:</strong> ${itemsSummary}
              </div>
              <div class="order-foot">
                <div>
                  <small style="color:#667085;display:block;">Total Amount:</small>
                  <span class="order-total">${formatPrice(order.total)}</span>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button onclick="downloadOrderInvoice('${safeOrderJson}')" class="btn-action btn-secondary" title="Download official PDF/HTML invoice">
                    <span class="material-symbols-outlined" style="font-size:16px;">download</span> Invoice
                  </button>
                  <button onclick="emailOrderInvoice('${safeOrderJson}')" class="btn-action btn-secondary" title="Send copy to email">
                    <span class="material-symbols-outlined" style="font-size:16px;">email</span> Email Invoice
                  </button>
                </div>
              </div>
            </article>`;
        }).join('');
      };

      window.downloadOrderInvoice = function(encodedOrder) {
        try {
          const order = JSON.parse(decodeURIComponent(encodedOrder));
          if (!confirm('Do you want to download the invoice for this order?')) return;
          if (window.InvoiceGenerator) {
            InvoiceGenerator.download(order);
          } else {
            showToast('Invoice generator unavailable', 'error');
          }
        } catch (e) {
          console.error('Invoice download error:', e);
          showToast('Could not generate invoice', 'error');
        }
      };

      window.emailOrderInvoice = function(encodedOrder) {
        try {
          const order = JSON.parse(decodeURIComponent(encodedOrder));
          if (window.InvoiceGenerator && InvoiceGenerator.sendInvoiceEmails) {
            InvoiceGenerator.sendInvoiceEmails(order);
          } else {
            showToast('Invoice emailer unavailable', 'error');
          }
        } catch (e) {
          console.error('Invoice email error:', e);
          showToast('Could not open email client', 'error');
        }
      };

      // Check Authentication & Load Orders
      const adminSession = Storage.get('sukhi_admin_session');
      if (adminSession && adminSession.loggedInAt) {
        updateProfile({ displayName: 'Store Administrator', email: adminSession.email || 'sukhigopi2006@gmail.com' });
        render(Storage.get('sukhi_orders', []));
      }

      if (window.auth) {
        auth.onAuthStateChanged(user => {
          if (!user && !adminSession) {
            window.location.href = 'login.html?redirect=account.html';
            return;
          }
          if (user) updateProfile(user);

          // Try Firestore if available; always fall back smoothly to local storage
          if (window.db && user) {
            try {
              db.collection('orders').where('userId', '==', user.uid).onSnapshot(snapshot => {
                const fsOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                  .sort((a, b) => String(b.createdAt?.seconds || '').localeCompare(String(a.createdAt?.seconds || '')));
                const localOrders = getLocalOrdersForUser(user);
                // Merge unique orders
                const map = new Map();
                fsOrders.forEach(o => map.set(o.id, o));
                localOrders.forEach(o => { if (!map.has(o.id)) map.set(o.id, o); });
                render(Array.from(map.values()));
              }, err => {
                console.warn('Firestore orders error, using local orders:', err);
                render(getLocalOrdersForUser(user));
              });
            } catch (err) {
              render(getLocalOrdersForUser(user));
            }
          } else {
            render(getLocalOrdersForUser(user));
          }
        });
      } else {
        render(Storage.get('sukhi_orders', []));
      }
    });
  </script>
</body>
</html>
