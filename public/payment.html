<script>
  // Fix navigation links on all pages
  document.addEventListener('DOMContentLoaded', () => {
    // Bottom nav
    const bottomLinks = document.querySelectorAll('nav.fixed a, nav[class*="bottom"] a');
    bottomLinks.forEach(a => {
      const text = (a.textContent || '').toLowerCase();
      if (text.includes('home')) a.href = 'index.html';
      else if (text.includes('wishlist') || text.includes('favorite')) a.href = 'wishlist.html';
      else if (text.includes('cart') || text.includes('bag')) a.href = 'cart.html';
      else if (text.includes('profile') || text.includes('person')) a.href = 'login.html';
    });
  });
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cart = Cart.load();
  if (!cart.length) {
    location.href = 'shop.html';
    return;
  }

  document.querySelectorAll('button').forEach(btn => {
    const t = (btn.textContent || '').toLowerCase();
    if (t.includes('pay') || t.includes('confirm') || t.includes('place order') || t.includes('complete')) {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = 'Processing...';

        try {
          const delivery = JSON.parse(sessionStorage.getItem('sukhi_delivery') || '{}');
          if (window.Customers && (delivery.name || delivery.email || delivery.phone)) {
            Customers.add(delivery).catch(e => console.warn('Customer record sync note:', e));
          }
          const order = await Orders.create({
            delivery,
            paymentMethod: 'UPI / Card / COD',
            email: AppState.user?.email || delivery.email || 'guest@sukhi.com'
          });
          sessionStorage.setItem('sukhi_last_order', JSON.stringify({ id: order.id, total: order.total }));
          showToast('Order placed successfully!');
          setTimeout(() => location.href = 'order-success.html?id=' + order.id, 1000);
        } catch (err) {
          console.error(err);
          // Even without Firebase, simulate success for demo
          const fakeId = 'ORD' + Date.now().toString().slice(-8);
          sessionStorage.setItem('sukhi_last_order', JSON.stringify({ id: fakeId, total: Cart.getTotal() }));
          Cart.clear();
          showToast('Order placed (demo mode)');
          setTimeout(() => location.href = 'order-success.html?id=' + fakeId, 1000);
        }
      });
    }
  });
});
</script>
