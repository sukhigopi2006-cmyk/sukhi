<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Shopping Cart - Sukhi Fireworks</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#ff6a00",
            "primary-dark": "#e05a00",
            charcoal: "#1c1917",
            "charcoal-muted": "#57534e",
            "card-bg": "#faf8f5",
            "border-subtle": "#eddcd2"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            mono: ["Space Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="js/site-shell.css"/>
  <style>
    /* Mobile Android viewport optimizations */
    .pb-mobile-action {
      padding-bottom: 120px;
    }
    @media (min-width: 1024px) {
      .pb-mobile-action {
        padding-bottom: 40px;
      }
    }
  </style>
</head>
<body class="bg-white text-charcoal font-sans min-h-screen flex flex-col antialiased">

  <main class="flex-grow w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 pb-mobile-action">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-stone-200">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-charcoal tracking-tight font-mono">Shopping Cart</h1>
        <p class="text-xs sm:text-sm text-charcoal-muted mt-0.5">Review items before requesting your order</p>
      </div>
      <span id="cart-item-badge" class="text-xs sm:text-sm font-bold bg-orange-100 text-primary px-3 py-1 rounded-full">0 Items</span>
    </div>

    <!-- Dynamic Cart Container -->
    <div id="cart-view-container">
      <!-- Loading Skeleton -->
      <div class="py-16 text-center text-stone-400">
        <span class="material-symbols-outlined text-4xl animate-spin text-primary">sync</span>
        <p class="mt-2 text-sm font-medium">Loading your festive cart...</p>
      </div>
    </div>
  </main>

  <!-- Mobile Fixed Bottom Action Bar (specifically optimized for Android) -->
  <div id="mobile-cart-action-bar" class="fixed bottom-14 left-0 w-full bg-white/95 backdrop-blur-md border-t border-stone-200 p-3.5 z-40 lg:hidden shadow-[0_-4px_20px_rgba(0,0,0,0.08)]">
    <div class="max-w-md mx-auto flex items-center justify-between gap-4">
      <div>
        <span class="text-[11px] text-stone-500 font-bold uppercase tracking-wider block">Total Amount</span>
        <span id="mobile-bar-total" class="text-xl font-extrabold text-primary font-mono">₹0.00</span>
      </div>
      <a href="checkout.html" class="flex-1 bg-primary hover:bg-primary-dark active:scale-95 text-white font-bold text-sm py-3 px-5 rounded-xl shadow-md shadow-orange-500/25 flex items-center justify-center gap-1.5 transition-all text-center">
        <span>Proceed to Checkout</span>
        <span class="material-symbols-outlined text-base">arrow_forward</span>
      </a>
    </div>
  </div>

  <!-- Firebase SDK + App Logic -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/site-shell.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await Products.load();
      } catch (_) {}
      renderCart();
    });

    function updateQty(id, qty) {
      const parsedQty = parseInt(qty) || 0;
      if (parsedQty <= 0) {
        removeItem(id);
      } else {
        Cart.updateQty(id, parsedQty);
        renderCart();
      }
    }

    function removeItem(id) {
      Cart.remove(id);
      renderCart();
      showToast('Item removed from cart', 'info');
    }

    function renderCart() {
      const cart = Cart.load();
      const container = document.getElementById('cart-view-container');
      const badge = document.getElementById('cart-item-badge');
      const mobileBar = document.getElementById('mobile-cart-action-bar');
      const mobileTotal = document.getElementById('mobile-bar-total');

      const count = Cart.getCount();
      if (badge) badge.textContent = `${count} ${count === 1 ? 'Item' : 'Items'}`;

      if (!cart || cart.length === 0) {
        if (mobileBar) mobileBar.classList.add('hidden');
        if (container) {
          container.innerHTML = `
            <div class="bg-card-bg border border-dashed border-stone-300 rounded-3xl p-10 md:p-16 text-center max-w-2xl mx-auto shadow-sm my-6">
              <div class="w-20 h-20 bg-orange-50 text-primary rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="material-symbols-outlined text-4xl">shopping_cart</span>
              </div>
              <h2 class="text-2xl font-extrabold text-charcoal">Your cart is empty</h2>
              <p class="mt-2 text-sm text-charcoal-muted max-w-sm mx-auto">
                Explore our festive fireworks catalog from Sivakasi to fill your celebration!
              </p>
              <a href="shop.html" class="mt-6 inline-flex items-center gap-2 rounded-xl bg-primary px-6 py-3.5 text-sm font-bold text-white shadow-lg shadow-orange-500/20 hover:bg-primary-dark transition active:scale-95">
                Browse Fireworks Catalog
                <span class="material-symbols-outlined text-base">arrow_forward</span>
              </a>
            </div>
          `;
        }
        return;
      }

      if (mobileBar) mobileBar.classList.remove('hidden');

      const subtotal = Cart.getTotal();
      const tax = subtotal * 0.18;
      const total = subtotal + tax;

      if (mobileTotal) mobileTotal.textContent = formatPrice(total);

      if (container) {
        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <!-- Left: Items List -->
            <div class="lg:col-span-8 space-y-4">
              ${cart.map(item => {
                const itemPrice = Number(item.price) || 0;
                const itemQty = Number(item.qty) || 1;
                const lineTotal = itemPrice * itemQty;
                const imgSrc = item.image || 'pics/pencil_trademark_transparent.png';
                return `
                  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-4 rounded-2xl border border-stone-200 bg-white hover:border-orange-200 transition shadow-sm">
                    <div class="flex items-center gap-3.5 min-w-0">
                      <img src="${imgSrc}" onerror="handleImageError(this)" alt="${item.name}"
                        class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-xl border border-stone-100 bg-stone-50 shrink-0" />
                      <div class="min-w-0">
                        <h3 class="font-bold text-stone-900 text-sm sm:text-base truncate">${item.name}</h3>
                        <p class="text-primary font-bold text-sm mt-0.5">${formatPrice(itemPrice)} <span class="text-stone-400 text-xs font-normal">/ unit</span></p>
                        <span class="text-[11px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-medium inline-block mt-1">In Stock</span>
                      </div>
                    </div>

                    <div class="flex items-center justify-between sm:justify-end gap-5 w-full sm:w-auto pt-2 sm:pt-0 border-t sm:border-t-0 border-stone-100">
                      <!-- Stepper -->
                      <div class="flex items-center border border-stone-200 rounded-xl overflow-hidden bg-stone-50">
                        <button onclick="updateQty('${item.id}', ${itemQty - 1})"
                          class="w-9 h-9 flex items-center justify-center text-stone-600 hover:bg-stone-200 active:bg-stone-300 font-bold text-base transition">
                          −
                        </button>
                        <span class="w-8 text-center text-xs font-bold text-stone-800">${itemQty}</span>
                        <button onclick="updateQty('${item.id}', ${itemQty + 1})"
                          class="w-9 h-9 flex items-center justify-center text-stone-600 hover:bg-stone-200 active:bg-stone-300 font-bold text-base transition">
                          +
                        </button>
                      </div>

                      <!-- Line Total & Delete -->
                      <div class="text-right min-w-[80px]">
                        <div class="font-extrabold text-stone-900 text-sm sm:text-base font-mono">${formatPrice(lineTotal)}</div>
                        <button onclick="removeItem('${item.id}')" class="text-xs text-red-500 hover:text-red-700 font-medium hover:underline inline-block mt-0.5">
                          Remove
                        </button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}

              <div class="pt-3">
                <a href="shop.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-stone-600 hover:text-primary transition">
                  <span class="material-symbols-outlined text-sm">arrow_back</span>
                  Add more fireworks
                </a>
              </div>
            </div>

            <!-- Right: Order Summary Sidebar -->
            <div class="lg:col-span-4 sticky top-24">
              <div class="rounded-3xl border border-stone-200 bg-card-bg p-6 shadow-sm">
                <h2 class="text-lg font-extrabold text-charcoal mb-4 pb-3 border-b border-stone-200 font-mono">Order Summary</h2>

                <div class="space-y-3 text-sm pb-4 border-b border-stone-200">
                  <div class="flex justify-between items-center text-charcoal-muted">
                    <span>Subtotal (${count} items)</span>
                    <span class="font-semibold text-charcoal font-mono">${formatPrice(subtotal)}</span>
                  </div>
                  <div class="flex justify-between items-center text-charcoal-muted">
                    <span>Estimated GST (18%)</span>
                    <span class="font-semibold text-charcoal font-mono">${formatPrice(tax)}</span>
                  </div>
                  <div class="flex justify-between items-center text-charcoal-muted">
                    <span>Delivery Charges</span>
                    <span class="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded text-xs">FREE</span>
                  </div>
                </div>

                <div class="flex justify-between items-baseline pt-4 mb-6">
                  <span class="text-base font-bold text-charcoal">Estimated Total</span>
                  <span class="text-2xl font-extrabold text-primary font-mono">${formatPrice(total)}</span>
                </div>

                <a href="checkout.html"
                  class="w-full bg-primary hover:bg-primary-dark active:scale-[0.98] text-white font-bold text-base py-3.5 px-6 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-orange-500/25 transition-all text-center">
                  Proceed to Checkout
                  <span class="material-symbols-outlined text-base">arrow_forward</span>
                </a>

                <p class="text-[11px] text-stone-400 text-center mt-3 flex items-center justify-center gap-1">
                  <span class="material-symbols-outlined text-xs text-emerald-600">verified</span>
                  Zero advance fee • Order request verified directly
                </p>
              </div>
            </div>
          </div>
        `;
      }
    }

    window.updateQty = updateQty;
    window.removeItem = removeItem;
  </script>
</body>
</html>
